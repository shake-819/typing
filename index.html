<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タイピング練習(ローマ字入力・変換なし)</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>タイピング練習</h1>
      <p class="subtitle">ローマ字入力の練習(変換なし/変換ありを選択可能)</p>
    </header>

    <!-- 設定画面: ジャンル・難易度・時間を選んでから練習を始める -->
    <section id="setup-screen" class="screen">
      <div class="setting-block">
        <p class="setting-label">出題内容</p>
        <div class="category-bar" id="category-bar">
          <button class="category-btn active" data-category="typing">
            <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="12" rx="2"/>
              <path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01"/>
              <path d="M6.5 13.5h.01M10 13.5h.01M13.5 13.5h.01M17 13.5h.01"/>
              <path d="M7 16.7h10"/>
            </svg>
            <span>タイピング</span>
          </button>
          <button class="category-btn" data-category="business">
            <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="7.5" width="18" height="12" rx="2"/>
              <path d="M8 7.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5"/>
              <path d="M3 12.5h18"/>
            </svg>
            <span>ビジネス系</span>
          </button>
          <button class="category-btn" data-category="it">
            <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="7" y="7" width="10" height="10" rx="1.5"/>
              <path d="M9.5 7V4M14.5 7V4M9.5 20v-3M14.5 20v-3M7 9.5H4M7 14.5H4M20 9.5h-3M20 14.5h-3"/>
            </svg>
            <span>IT系</span>
          </button>
          <button class="category-btn" data-category="programming">
            <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 8l-4 4 4 4"/>
              <path d="M15 8l4 4-4 4"/>
            </svg>
            <span>プログラミング</span>
          </button>
        </div>

        <div class="difficulty-bar subgenre-bar" data-category-group="typing">
          <button class="genre-btn active" data-genre="difficulty" data-difficulty="easy">易しい</button>
          <button class="genre-btn" data-genre="difficulty" data-difficulty="normal">ふつう</button>
          <button class="genre-btn" data-genre="difficulty" data-difficulty="hard">難しい</button>
        </div>
        <div class="difficulty-bar subgenre-bar" data-category-group="business" style="display:none;">
          <button class="genre-btn active" data-genre="business">ビジネス用語</button>
          <button class="genre-btn" data-genre="email">メール</button>
          <button class="genre-btn" data-genre="kentei">検定(速度)</button>
        </div>
        <div class="difficulty-bar subgenre-bar" data-category-group="it" style="display:none;">
          <button class="genre-btn active" data-genre="it">IT用語</button>
          <button class="genre-btn" data-genre="dev">実務会話</button>
        </div>
        <div class="difficulty-bar subgenre-bar" data-category-group="programming" style="display:none;">
          <button class="genre-btn active" data-genre="js">JS</button>
          <button class="genre-btn" data-genre="sql">SQL</button>
        </div>
      </div>

      <div class="setting-block" id="mode-setting-block">
        <p class="setting-label">入力モード</p>
        <div class="difficulty-bar">
          <button class="mode-btn active" data-mode="off">変換なし</button>
          <button class="mode-btn" data-mode="on">変換あり</button>
        </div>
      </div>

      <div class="setting-block">
        <p class="setting-label">記号問題</p>
        <div class="difficulty-bar">
          <button class="punctuation-btn active" data-punctuation="on">！？を含める</button>
          <button class="punctuation-btn" data-punctuation="off">！？を除く</button>
        </div>
      </div>

      <div class="setting-block">
        <p class="setting-label">制限時間</p>
        <div class="difficulty-bar">
          <button class="duration-btn active" data-duration="30">30秒</button>
          <button class="duration-btn" data-duration="60">60秒</button>
          <button class="duration-btn" data-duration="90">90秒</button>
          <button class="duration-btn" data-duration="120">120秒</button>
          <button class="duration-btn" data-duration="600">10分</button>
          <button class="duration-btn" data-duration="unlimited">無制限</button>
        </div>
      </div>

      <button id="start-btn" class="start-btn">はじめる</button>

      <details class="weak-key-panel">
        <summary>苦手なキーを確認する</summary>
        <div class="weak-key-header">
          <p class="muted-text">直近の練習でミスが多かったキーです</p>
          <button id="reset-stats-btn" class="ghost-btn">記録をリセット</button>
        </div>
        <div id="weak-key-list"></div>
      </details>
    </section>

    <!-- 練習画面 -->
    <section id="practice-screen" class="screen" style="display:none;">
      <div class="practice-topbar">
        <button id="back-btn" class="ghost-btn back-btn">← 設定に戻る</button>
        <div class="timer-badge" id="timer-badge">残り 30.0秒</div>
      </div>

      <main class="practice-card">
        <p class="progress-label" id="progress-label">1問目</p>

        <p class="display-line" id="display-line"></p>
        <div class="romaji-line" id="romaji-line"></div>
        <input
          id="ime-input"
          class="ime-input"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="ここに入力してEnterで確定"
          style="display:none;"
        />

        <!-- 検定(速度)モード専用: 左に問題文(読みは出さない)、右に
             実際のWordの入力画面をイメージした用紙風の入力欄を並べる。
             genre が "kentei" のときだけ app.js から表示を切り替える。 -->
        <div class="kentei-columns" id="kentei-columns" style="display:none;">
          <div class="kentei-problem-pane">
            <p class="kentei-pane-label">問題文</p>
            <p class="kentei-problem-text" id="kentei-problem-text"></p>
          </div>
          <div class="kentei-word-pane">
            <div class="kentei-word-toolbar">
              <span></span><span></span><span></span>
            </div>
            <textarea
              id="kentei-input"
              class="kentei-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="ここに入力してください(IMEで変換できます・Enterで改行できます)"
            ></textarea>
            <!-- 完了ボタンを押すまで採点しない。押した後はここに間違い箇所を
                 赤字で示した結果を表示し、ボタンは「次の問題へ」に切り替わる。 -->
            <div id="kentei-result-text" class="kentei-input kentei-result-text" style="display:none;"></div>
            <div class="kentei-word-footer">
              <button id="kentei-finish-btn" class="primary-btn" data-mode="check">完了</button>
            </div>
          </div>
        </div>

        <p class="focus-hint" id="focus-hint">キーボードで入力を開始してください</p>

        <div class="result-panel" id="result-panel" style="display:none;">
          <p id="result-text"></p>

          <!-- 名前は初回のみ入力し、localStorageに保存して以降は自動でランキングに送信する -->
          <div class="ranking-name-setup" id="ranking-name-setup" style="display:none;">
            <p class="ranking-name-hint">ランキングに載せる名前を最初に決めてください(以後この端末では自動で使われます)</p>
            <div class="ranking-name-row">
              <input type="text" id="ranking-name-input" maxlength="20" placeholder="名前(20文字まで)" />
              <button id="ranking-name-save-btn" class="primary-btn">登録してランキングに送信</button>
            </div>
          </div>

          <div class="ranking-panel" id="ranking-panel" style="display:none;">
            <p class="ranking-title" id="ranking-title">このモードのランキング</p>
            <ol class="ranking-list" id="ranking-list"></ol>
          </div>

          <button id="restart-btn" class="primary-btn">もう一度</button>
        </div>

        <div class="stats-grid" id="stats-grid">
          <div class="stat-box">
            <p class="stat-label">速度</p>
            <p class="stat-value" id="speed-out">0.0<span class="unit-label"> 打/秒</span></p>
          </div>
          <div class="stat-box">
            <p class="stat-label" id="time-label">残り時間</p>
            <p class="stat-value" id="time-out">0.0<span class="unit-label"> 秒</span></p>
          </div>
          <div class="stat-box">
            <p class="stat-label">ミス数</p>
            <p class="stat-value" id="miss-out">0</p>
          </div>
          <div class="stat-box">
            <p class="stat-label">正確率</p>
            <p class="stat-value" id="accuracy-out">100<span class="unit-label">%</span></p>
          </div>
        </div>

        <div class="keyboard" id="keyboard"></div>
      </main>
    </section>

    <!-- ジャンルごとの自己ベストランキング。ページ最下部に常時表示(制限時間は区別せず、そのジャンルの中で一番速い記録を表示) -->
    <section class="genre-ranking-overview" id="genre-ranking-overview">
      <h2 class="genre-ranking-title">ジャンル別ランキング(自己ベスト)</h2>
      <div class="genre-ranking-grid" id="genre-ranking-grid"></div>
    </section>
  </div>

  <script src="kana-table.js"></script>
  <script src="sentences.js"></script>
  <script src="business-sentences.js"></script>
  <script src="js-sentences.js"></script>
  <script src="sql-sentences.js"></script>
  <script src="it-sentences.js"></script>
  <script src="email-sentences.js"></script>
  <script src="dev-sentences.js"></script>
  <script src="kentei-sentences.js"></script>
  <script src="typing-engine.js"></script>
  <script src="keyboard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="ranking.js"></script>
  <script src="app.js"></script>
</body>
</html>
